<div class="app-root">
  <div class="container-fluid px-0 bg-white shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" routerLink="/dashboard">Business Dashboard</a>
        <div class="d-flex gap-3">
          <a class="btn btn-outline-primary btn-sm" routerLink="/dashboard">Dashboard</a>
          <a class="btn btn-outline-secondary btn-sm" routerLink="/products">Products</a>
          <a class="btn btn-outline-secondary btn-sm" routerLink="/customers">Customers</a>
          <span class="ms-2 align-self-center small text-primary" *ngIf="loading$ | async">
            <i class="fa fa-spinner fa-spin me-1"></i>Loading
          </span>
        </div>
      </div>
    </nav>
  </div>

  <main class="py-4">
    <router-outlet></router-outlet>
    <app-loader></app-loader>
  </main>
</div>
