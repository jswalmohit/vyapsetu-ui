<div class="custom-modal">
  <div class="modal-backdrop-custom"></div>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 shadow-lg overflow-hidden">
      <div class="modal-header border-0 pb-0">
        <div>
          <h5 class="modal-title">Line Items - {{ selectedProduct?.productName }}</h5>
          <p class="text-muted mb-0">View all line items for this product.</p>
        </div>
        <button type="button" class="btn-close" aria-label="Close" (click)="onClose()"></button>
      </div>
      <div class="modal-body pt-0">
        <div *ngIf="(loadLineItemsAction$ | async); else lineItemsContent" class="text-center py-5">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <ng-template #lineItemsContent>
          <div class="table-responsive line-items-table-wrapper">
            <table class="table table-borderless align-middle mb-0">
              <thead>
                <tr class="text-muted small text-uppercase border-bottom">
                  <th>Purchase Price</th>
                  <th>GST %</th>
                  <th>Quantity</th>
                  <th>Purchase Date</th>
                  <th>Seller Name</th>
                  <th>Seller GSTIN</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let lineItem of lineItems" class="line-item-row">
                  <td>
                    <input
                      type="number"
                      class="form-control form-control-sm line-item-input"
                      [value]="lineItem.purchasePrice"
                      min="0"
                      step="0.01"
                      (input)="lineItem.purchasePrice = Number($any($event.target).value)"
                    />
                  </td>
                  <td>
                    <input
                      type="number"
                      class="form-control form-control-sm line-item-input"
                      [value]="lineItem.gst"
                      min="0"
                      step="0.1"
                      (input)="lineItem.gst = Number($any($event.target).value)"
                    />
                  </td>
                  <td>
                    <input
                      type="number"
                      class="form-control form-control-sm line-item-input"
                      [value]="lineItem.quantity"
                      min="0"
                      step="1"
                      (input)="lineItem.quantity = Number($any($event.target).value)"
                    />
                  </td>
                  <td>
                    <input
                      type="date"
                      class="form-control form-control-sm line-item-input"
                      [value]="lineItem.purchaseDate | date:'yyyy-MM-dd'"
                      [max]="today"
                      (input)="lineItem.purchaseDate = $any($event.target).value"
                    />
                  </td>
                  <td>
                    <input
                      type="text"
                      class="form-control form-control-sm line-item-input"
                      [value]="lineItem.sellerName"
                      (input)="lineItem.sellerName = $any($event.target).value"
                    />
                  </td>
                  <td>
                    <input
                      type="text"
                      class="form-control form-control-sm line-item-input"
                      [value]="lineItem.sellerGSTIN"
                      (input)="lineItem.sellerGSTIN = $any($event.target).value"
                    />
                  </td>
                </tr>
                <tr *ngIf="lineItems.length === 0">
                  <td colspan="6" class="text-center py-5 text-muted">
                    No line items found for this product.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </ng-template>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Close</button>
      </div>
    </div>
  </div>
</div>
