<div class="registration-dialog">
  <form [formGroup]="registerForm" (ngSubmit)="submit()" novalidate>
    <div *ngIf="errorMessage" class="alert alert-danger mb-3" role="alert">
      {{ errorMessage }}
    </div>

    <div class="mb-3">
      <label class="form-label small" for="customerName">Customer Name</label>
      <input
        id="customerName"
        class="form-control"
        formControlName="customerName"
        [class.is-invalid]="customerNameControl?.touched && customerNameControl?.invalid"
        placeholder="Enter customer name"
        autocomplete="name"
      />
      <div class="invalid-feedback" *ngIf="customerNameControl?.touched && customerNameControl?.hasError('required')">
        Customer name is required.
      </div>
    </div>

    <div class="mb-3" *ngIf="mode === 'edit'">
      <label class="form-label small" for="address">Address</label>
      <input
        id="address"
        class="form-control"
        formControlName="address"
        [class.is-invalid]="addressControl?.touched && addressControl?.invalid"
        placeholder="Enter address"
        autocomplete="street-address"
      />
      <div class="invalid-feedback" *ngIf="addressControl?.touched && addressControl?.hasError('required')">
        Address is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label small" for="phoneNumber">Phone Number</label>
      <input
        id="phoneNumber"
        class="form-control"
        formControlName="phoneNumber"
        readonly
        inputmode="numeric"
        autocomplete="tel"
      />
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <button type="button" class="btn btn-outline-secondary" (click)="cancel.emit()" [disabled]="isLoading">
        Cancel
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ mode === 'edit' ? 'Update Customer' : 'Save Customer' }}
      </button>
    </div>
  </form>
</div>
